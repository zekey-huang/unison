<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>unison</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f12;
      color: #f2f2f2;
    }
    h1 { margin: 0; font-size: 2.5rem; letter-spacing: -0.02em; }
    .subtitle { margin: 0; color: #8a8a94; }
    #status {
      padding: 6px 14px;
      border-radius: 999px;
      background: #2a2a31;
      font-size: 0.9rem;
    }
    button {
      padding: 14px 40px;
      border: none;
      border-radius: 12px;
      background: #1db954;
      color: #0f0f12;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { transform: scale(0.97); }
    #log {
      width: 100%;
      max-width: 420px;
      height: 200px;
      margin: 0;
      padding: 12px;
      overflow-y: auto;
      border-radius: 12px;
      background: #18181d;
      color: #b8b8c2;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <h1>unison</h1>
  <p class="subtitle">play together, in sync</p>

  <div id="status">not connected</div>
  <button id="join">Join</button>

  <pre id="log"></pre>

  <script>
    const statusEl = document.getElementById('status');
  const logEl = document.getElementById('log');
  const joinBtn = document.getElementById('join');
  let myId;

  function log(text) {
    logEl.textContent += text + '\n';
    logEl.scrollTop = logEl.scrollHeight;
  }

  const ws = new WebSocket(`ws://${location.host}`);

  ws.addEventListener('open', () => {
    statusEl.textContent = 'connected';
    log('connected to server');
  });

  ws.addEventListener('message', (event) => {
    const msg = JSON.parse(event.data);
    if (msg.type === 'welcome') {
      myId = msg.id;
      log(`I am client ${myId}`);
    } else if (msg.type === 'requestAck') {
      log(`server: ${msg.msg}`);
    } else {
      log(`unknown message type: ${msg.type}`);
    }
  });

  ws.addEventListener('close', () => {
    statusEl.textContent = 'disconnected';
    log('disconnected');
  });

  ws.addEventListener('error', () => log('websocket error'));

  joinBtn.addEventListener('click', () => {
    ws.send(JSON.stringify({ type: 'hello', text: `hi from client ${myId}` }));
    log('sent hello');
  });
  </script>
</body>
</html>
